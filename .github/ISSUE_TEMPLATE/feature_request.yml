name: Feature request / Предложить улучшение
description: Suggest an idea / Предложите идею
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see? / Что хотелось бы добавить?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful? / Чем это полезно?
