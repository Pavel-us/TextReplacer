[package]
name = "text-replacer"
version = "1.4.1"
description = "Find and replace text in files: plain text, Word, Excel, PowerPoint, LibreOffice, PDF"
license = "MIT"
repository = "https://github.com/Pavel-us/TextReplacer"
readme = "../README.md"
keywords = ["search", "replace", "batch", "docx", "tauri"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
rayon = "1"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.34", optional = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["pdf"]
pdf = ["dep:lopdf"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
